name: Build PocketGGUF APK (No Android Studio Needed)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK, NDK 26.3 & CMake 3.22.1
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Debug APK with Gradle
        run: |
          gradle :app:assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketGGUF-armeabi-v7a-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
